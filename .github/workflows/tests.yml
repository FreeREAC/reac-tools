name: tests

# The stdlib-only unittest suite of tests/ (make test).
# Every pull request and push to main; docs.yml (tags only) never ran the tests.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: make test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: make test

  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
